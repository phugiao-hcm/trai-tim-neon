<script type="importmap">

<script type="module">

import * as THREE from "three";

import {
    EffectComposer
} from "three/addons/postprocessing/EffectComposer.js";

import {
    RenderPass
} from "three/addons/postprocessing/RenderPass.js";

import {
    UnrealBloomPass
} from "three/addons/postprocessing/UnrealBloomPass.js";

import {
    OutputPass
} from "three/addons/postprocessing/OutputPass.js";


/* =====================================================
   CONFIG
===================================================== */

const isMobile =
    window.innerWidth < 600;


const CONFIG = {

    /*
     * Số particle tạo thành trái tim
     *
     * Desktop:
     * 30.000
     *
     * Mobile:
     * 15.000
     */

    heartParticles:
        isMobile
            ? 1350
            : 2100,


    /*
     * Particle background
     */

    stars:
        isMobile
            ? 350
            : 700,


    /*
     * Particle mặt đất
     */

    floorParticles:
        isMobile
            ? 1800
            : 3000,


    /*
     * Particle bay
     */

    floatingParticles:
        isMobile
            ? 250
            : 500
};


/* =====================================================
   BASIC
===================================================== */

const canvas =
    document.getElementById(
        "canvas"
    );

const loading =
    document.getElementById(
        "loading"
    );


/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x000000
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        .1,

        1000
    );


camera.position.set(
    0,
    1.5,
    isMobile
        ? 24
        : 22
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({

        canvas,

        antialias: true,

        powerPreference:
            "high-performance"
    });


renderer.setPixelRatio(

    Math.min(

        window.devicePixelRatio,

        isMobile
            ? 1.5
            : 2
    )
);


renderer.setSize(

    window.innerWidth,

    window.innerHeight
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.toneMapping =
    THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
    .9;


/* =====================================================
   BLOOM
===================================================== */

const composer =
    new EffectComposer(
        renderer
    );


composer.addPass(
    new RenderPass(
        scene,
        camera
    )
);


const bloom = new UnrealBloomPass(
    new THREE.Vector2(
        window.innerWidth,
        window.innerHeight
    ),
    isMobile ? 0.18 : 0.4,
    isMobile ? 0.22 : 0.35,
    0.08
);


composer.addPass(
    bloom
);


composer.addPass(
    new OutputPass()
);


/* =====================================================
   HEART GROUP
===================================================== */

const heartGroup =
    new THREE.Group();

scene.add(
    heartGroup
);


/* =====================================================
   HEART FUNCTION
===================================================== */

function heartFunction(
    x,
    y
) {

    /*
     * Phương trình trái tim
     *
     * (x² + y² - 1)³
     * - x²y³ <= 0
     */

    const a =
        x * x +
        y * y -
        1;

    return (
        a * a * a
        -
        x * x *
        y * y *
        y
    );
}


/* =====================================================
   CREATE HEART PARTICLES
===================================================== */

function createHeartParticles() {

    const count =
        CONFIG.heartParticles;


    const positions =
        new Float32Array(
            count * 3
        );


    const colors =
        new Float32Array(
            count * 3
        );


    const sizes =
        new Float32Array(
            count
        );


    const randoms =
        new Float32Array(
            count
        );


    let index = 0;


    /*
     * Heart scale
     */

    const scale =
        isMobile
            ? 4.0
            : 4.5;


    while (
        index < count
    ) {

        /*
         * Random 2D point
         */

        const x =
            THREE.MathUtils.randFloat(
                -1.5,
                1.5
            );


        const y =
            THREE.MathUtils.randFloat(
                -1.35,
                1.25
            );


        /*
         * Heart shape
         */

        if (
            heartFunction(
                x,
                y
            ) > 0
        ) {
            continue;
        }


        /*
         * Normalize
         */

        const nx =
            x / 1.5;

        const ny =
            y / 1.35;


        /*
         * Center density
         */

        const center =
            Math.max(
                0,
                1 -
                Math.sqrt(
                    nx * nx +
                    ny * ny
                )
            );


        /*
         * Tạo chiều sâu 3D
         */

        const depth =
            (
                Math.random() -
                .5
            ) *
            (
                .7 +
                center * 3.2
            );


        /*
         * Hơi làm hạt lệch tự nhiên
         */

        const noise =
            (
                Math.random() -
                .5
            ) * .06;


        positions[
            index * 3
        ] =
            x * scale +
            noise;


        positions[
            index * 3 + 1
        ] =
            y * scale +
            noise;


        positions[
            index * 3 + 2
        ] =
            depth;


        /*
         * Particle size
         */

        sizes[index] =
            THREE.MathUtils.randFloat(
                .35,
                1.65
            );


        /*
         * Random
         */

        randoms[index] =
            Math.random();


        /*
         * Màu
         */

        const color =
            new THREE.Color();


        const randomColor =
            Math.random();


        if (
            randomColor < .55
        ) {

            color.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .08,
                    .3
                ),
                THREE.MathUtils.randFloat(
                    .25,
                    .55
                )
            );

        } else {

            color.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .25,
                    .55
                ),
                THREE.MathUtils.randFloat(
                    .5,
                    .85
                )
            );
        }


        colors[
            index * 3
        ] =
            color.r;


        colors[
            index * 3 + 1
        ] =
            color.g;


        colors[
            index * 3 + 2
        ] =
            color.b;


        index++;
    }


    /* =================================
       GEOMETRY
    ================================= */

    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    geometry.setAttribute(

        "aSize",

        new THREE.BufferAttribute(
            sizes,
            1
        )
    );


    geometry.setAttribute(

        "aRandom",

        new THREE.BufferAttribute(
            randoms,
            1
        )
    );


    /* =================================
       MATERIAL
    ================================= */

    const material =
        new THREE.ShaderMaterial({

            transparent:
                true,

            depthWrite:
                false,

            blending:
                THREE.AdditiveBlending,

            vertexColors:
                true,


            uniforms: {

                uTime: {
                    value: 0
                },

                uBeat: {
                    value: 1
                }
            },


            vertexShader: `

                attribute float aSize;
                attribute float aRandom;

                uniform float uTime;
                uniform float uBeat;

                varying vec3 vColor;
                varying float vRandom;


                void main() {

                    vec3 p =
                        position;


                    /*
                     * Particle chuyển động nhẹ
                     */

                    p.x +=
                        sin(
                            uTime * 1.2 +
                            aRandom * 30.0
                        ) * .018;


                    p.y +=
                        cos(
                            uTime * 1.4 +
                            aRandom * 25.0
                        ) * .018;


                    /*
                     * Heartbeat
                     */

                    p *= uBeat;


                    /*
                     * 3D camera
                     */

                    vec4 mvPosition =
                        modelViewMatrix *
                        vec4(
                            p,
                            1.0
                        );


                    /*
                     * Perspective
                     */

                    gl_PointSize =
                        aSize *
                        (
                            230.0 /
                            -mvPosition.z
                        );


                    gl_Position =
                        projectionMatrix *
                        mvPosition;


                    vColor =
                        color;


                    vRandom =
                        aRandom;
                }

            `,


            fragmentShader: `

                varying vec3 vColor;

                varying float vRandom;


                void main() {

                    vec2 uv =
                        gl_PointCoord -
                        .5;


                    float d =
                        length(uv);


                    if (
                        d > .5
                    ) {
                        discard;
                    }


                    /*
                     * Glow particle
                     */

                    float glow =
                        1.0 -
                        smoothstep(
                            0.0,
                            .5,
                            d
                        );


                    /*
                     * Random brightness
                     */

                    float brightness =
                        .65 +
                        fract(
                            vRandom * 13.7
                        ) * .7;


                    vec3 finalColor =
                        vColor *
                        brightness;


                    /*
                     * Viền glow
                     */

                    finalColor +=
                        vec3(
                            1.0,
                            .02,
                            .12
                        )
                        *
                        glow
                        *
                        .015;


                    gl_FragColor =
                        vec4(
                            finalColor,
                            glow * .5
                        );
                }

            `
        });


    const particles =
        new THREE.Points(
            geometry,
            material
        );


    heartGroup.add(
        particles
    );


    return particles;
}


const heartParticles =
    createHeartParticles();


/* =====================================================
   HEART POSITION
===================================================== */

heartGroup.position.y =
    isMobile
        ? 1.4
        : 1.3;


/* =====================================================
   BACKGROUND STARS
===================================================== */

function createStars() {

    const count =
        CONFIG.stars;


    const positions =
        new Float32Array(
            count * 3
        );


    const colors =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        positions[
            i * 3
        ] =
            THREE.MathUtils.randFloat(
                -35,
                35
            );


        positions[
            i * 3 + 1
        ] =
            THREE.MathUtils.randFloat(
                -25,
                30
            );


        positions[
            i * 3 + 2
        ] =
            THREE.MathUtils.randFloat(
                -40,
                -8
            );


        /*
         * Slight warm stars
         */

        const c =
            new THREE.Color();


        c.setRGB(
            1,
            THREE.MathUtils.randFloat(
                .5,
                1
            ),
            THREE.MathUtils.randFloat(
                .6,
                1
            )
        );


        colors[
            i * 3
        ] =
            c.r;


        colors[
            i * 3 + 1
        ] =
            c.g;


        colors[
            i * 3 + 2
        ] =
            c.b;
    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

                isMobile
                    ? .055
                    : .07,

            vertexColors:

            transparent:
                true,

            opacity:
                .65,

            depthWrite:
                false,

            blending:

        });


    const stars =
        new THREE.Points(
            geometry,
            material
        );


    scene.add(
        stars
    );


    return stars;
}


const stars =
    createStars();


/* =====================================================
   FLOOR PARTICLES
===================================================== */

function createFloor() {

    const count =
        CONFIG.floorParticles;


    const positions =
        new Float32Array(
            count * 3
        );


    const colors =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        /*
         * Circle distribution
         */

        const angle =
            Math.random() *
            Math.PI *
            2;


        /*
         * Concentrate in center
         */

        const radius =
            Math.pow(
                Math.random(),
                .65
            ) *
            8;


        const x =
            Math.cos(
                angle
            ) *
            radius;


        const z =
            Math.sin(
                angle
            ) *
            radius;


        /*
         * Floor dạng lõm
         */

        const y =
            -4.0 -
            radius * .07;


        positions[
            i * 3
        ] =
            x;


        positions[
            i * 3 + 1
        ] =
            y;


        positions[
            i * 3 + 2
        ] =
            z;


        /*
         * Màu
         */

        const c =
            new THREE.Color();


        const r =
            Math.random();


        if (
            r < .65
        ) {

            c.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .15,
                    .5
                ),
                THREE.MathUtils.randFloat(
                    .45,
                    .8
                )
            );

        } else {

            c.setRGB(
                THREE.MathUtils.randFloat(
                    .5,
                    1
                ),
                .7,
                1
            );
        }


        colors[
            i * 3
        ] =
            c.r;


        colors[
            i * 3 + 1
        ] =
            c.g;


        colors[
            i * 3 + 2
        ] =
            c.b;
    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(

        "color",

        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            size:
                isMobile
                    ? .055
                    : .07,

            vertexColors:
                true,

            transparent:
                true,

            opacity:
                .65,

            depthWrite:
                false,

            blending:
                THREE.AdditiveBlending
        });


    const floor =
        new THREE.Points(
            geometry,
            material
        );


    scene.add(
        floor
    );


    return floor;
}


const floor =
    createFloor();


/* =====================================================
   TEXT RING
===================================================== */

const textGroup =
    new THREE.Group();


scene.add(
    textGroup
);


const messages = [

    "Yêu em mãi ❤️",

    "Cảm ơn em ❤️",

    "Anh yêu em ❤️",

    "Mãi bên nhau ❤️",

    "Love you ❤️",

    "Forever ❤️",

    "Yêu em nhiều ❤️",

    "My love ❤️"
];


function createTextTexture(
    text
) {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        512;

    canvas.height =
        100;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        512,
        100
    );


    ctx.font = "bold 32px Arial";

    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.shadowColor =
        "#ff1493";


    ctx.shadowBlur =
        12;


    ctx.fillStyle =
        "rgba(255,255,255,.85)";


    ctx.fillText(
        text,
        256,
        50
    );


    const texture =
        new THREE.CanvasTexture(
            canvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;
}


function createTextRing() {

    const radius =
        isMobile
            ? 5.8
            : 7;


    messages.forEach(
        (
            message,
            index
        ) => {

            const texture =
                createTextTexture(
                    message
                );


            const material =
                new THREE.SpriteMaterial({

                    map:
                        texture,

                    transparent:
                        true,

                    opacity:
                        .75,

                    depthWrite:
                        false,

                    blending:
                        THREE.AdditiveBlending
                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            const angle =
                (
                    index /
                    messages.length
                ) *
                Math.PI *
                2;


            sprite.position.x =
                Math.cos(
                    angle
                ) *
                radius;


            sprite.position.z =
                Math.sin(
                    angle
                ) *
                radius;


            sprite.position.y =
                -4.1;


            sprite.scale.set(
                isMobile
                    ? 3.3
                    : 3.2,

                isMobile
                    ? .65
                    : .62,

                1
            );


            /*
             * Chữ nằm theo vòng tròn
             */

            sprite.rotation.y =
                -angle;


            textGroup.add(
                sprite
            );
        }
    );
}


createTextRing();


/* =====================================================
   SMALL FLOATING HEARTS
===================================================== */

function createSmallHeartTexture() {

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        128;

    canvas.height =
        128;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.translate(
        64,
        64
    );


    ctx.scale(
        1.3,
        1.3
    );


    ctx.beginPath();


    ctx.moveTo(
        0,
        35
    );


    ctx.bezierCurveTo(
        -50,
        0,
        -35,
        -35,
        -12,
        -35
    );


    ctx.bezierCurveTo(
        -3,
        -35,
        0,
        -25,
        0,
        -18
    );


    ctx.bezierCurveTo(
        0,
        -25,
        3,
        -35,
        12,
        -35
    );


    ctx.bezierCurveTo(
        35,
        -35,
        50,
        0,
        0,
        35
    );


    ctx.closePath();


    ctx.shadowColor =
        "#ff1493";


    ctx.shadowBlur =
        20;


    ctx.fillStyle =
        "#ff4bb2";


    ctx.fill();


    return new THREE.CanvasTexture(
        canvas
    );
}


function createFloatingHearts() {

    const group =
        new THREE.Group();


    const texture =
        createSmallHeartTexture();


    const count =
        isMobile
            ? 20
            : 45;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const material =
            new THREE.SpriteMaterial({

                map:
                    texture,

                color:
                    Math.random() >
                    .5
                        ? 0xff5db8
                        : 0xffb7e1,

                transparent:
                    true,

                opacity:
                    THREE.MathUtils.randFloat(
                        .3,
                        .9
                    ),

                depthWrite:
                    false,

                blending:
                    THREE.AdditiveBlending
            });


        const sprite =
            new THREE.Sprite(
                material
            );


        sprite.userData = {

            angle:
                Math.random() *
                Math.PI *
                2,

            radius:
                THREE.MathUtils.randFloat(
                    4,
                    9
                ),

            speed:
                THREE.MathUtils.randFloat(
                    .1,
                    .4
                ),

            y:
                THREE.MathUtils.randFloat(
                    -2,
                    7
                ),

            phase:
                Math.random() *
                Math.PI *
                2
        };


        const size =
            THREE.MathUtils.randFloat(
                .08,
                .3
            );


        sprite.scale.set(
            size,
            size,
            size
        );


        group.add(
            sprite
        );
    }


    scene.add(
        group
    );


    return group;
}


const floatingHearts =
    createFloatingHearts();


/* =====================================================
   MOUSE / TOUCH ROTATION
===================================================== */

let isDragging =
    false;


let lastX = 0;

let lastY = 0;


let targetRotationY =
    0;


let targetRotationX =
    0;


let currentRotationY =
    0;


let currentRotationX =
    0;


canvas.addEventListener(
    "pointerdown",
    event => {

        isDragging =
            true;


        lastX =
            event.clientX;


        lastY =
            event.clientY;


        canvas.setPointerCapture(
            event.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (
            !isDragging
        ) {
            return;
        }


        const dx =
            event.clientX -
            lastX;


        const dy =
            event.clientY -
            lastY;


        targetRotationY +=
            dx * .008;


        targetRotationX +=
            dy * .004;


        targetRotationX =
            THREE.MathUtils.clamp(
                targetRotationX,
                -.45,
                .45
            );


        lastX =
            event.clientX;


        lastY =
            event.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        isDragging =
            false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        isDragging =
            false;
    }
);


/* =====================================================
   ANIMATION
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* =================================
       AUTO ROTATE
    ================================= */

    if (
        !isDragging
    ) {

        targetRotationY +=
            .0018;
    }


    currentRotationY +=
        (
            targetRotationY -
            currentRotationY
        ) * .04;


    currentRotationX +=
        (
            targetRotationX -
            currentRotationX
        ) * .04;


    /*
     * Trái tim xoay
     */

    heartGroup.rotation.y =
        currentRotationY;


    heartGroup.rotation.x =
        currentRotationX;


    /* =================================
       HEARTBEAT
    ================================= */

    const beat =
        1 +
        Math.pow(
            Math.max(
                0,
                Math.sin(
                    time * 2.5
                )
            ),
            10
        ) *
        .035;


    heartParticles
        .material
        .uniforms
        .uTime
        .value =
            time;


    heartParticles
        .material
        .uniforms
        .uBeat
        .value =
            beat;


    /* =================================
       PARTICLE TWINKLE
    ================================= */

    heartParticles
        .material
        .opacity =
            .72 +
            Math.sin(
                time * 2
            ) *
            .12;


    /* =================================
       STARS
    ================================= */

    stars.rotation.y =
        time *
        .003;


    /* =================================
       FLOOR
    ================================= */

    floor.rotation.y =
        time *
        .012;


    /* =================================
       TEXT RING
    ================================= */

    textGroup.rotation.y =
        time *
        .045;


    /* =================================
       FLOATING HEARTS
    ================================= */

    floatingHearts
        .children
        .forEach(
            sprite => {

                const data =
                    sprite.userData;


                data.angle +=
                    data.speed *
                    .003;


                sprite.position.x =
                    Math.cos(
                        data.angle
                    ) *
                    data.radius;


                sprite.position.z =
                    Math.sin(
                        data.angle
                    ) *
                    data.radius;


                sprite.position.y =
                    data.y +
                    Math.sin(
                        time * 1.2 +
                        data.phase
                    ) *
                    .45;


                sprite.material.opacity =
                    .25 +
                    (
                        Math.sin(
                            time * 2 +
                            data.phase
                        ) + 1
                    ) *
                    .25;
            }
        );


    /* =================================
       CAMERA
    ================================= */

    camera.position.y =
        1.5 +
        Math.sin(
            time * .25
        ) *
        .12;


    camera.lookAt(
        0,
        0,
        0
    );


    /* =================================
       RENDER
    ================================= */

    composer.render();
}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    () => {

        const width =
            window.innerWidth;


        const height =
            window.innerHeight;


        camera.aspect =
            width / height;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );


        composer.setSize(
            width,
            height
        );


        bloom.resolution.set(
            width,
            height
        );
    }
);


/* =====================================================
   START
===================================================== */

setTimeout(
    () => {

        loading.classList.add(
            "hide"
        );

    },
    800
);

</script>

</body>
</html>
