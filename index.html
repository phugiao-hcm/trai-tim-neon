<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Anniversary 3D</title>
<link rel="icon" type="image/x-icon" href="images/heart.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #ff63b8;
    font-size: 12px;
    letter-spacing: 5px;
    transition: opacity 1s ease, visibility 1s ease;
}

#loading.hide {
    opacity: 0;
    visibility: hidden;
}

.message {
    position: fixed;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    z-index: 5;
    color: rgba(255, 160, 220, .75);
    font-size: clamp(11px, 2vw, 16px);
    letter-spacing: 4px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow:
        0 0 8px #ff1493,
        0 0 18px #ff1493;
}

/* =========================================================
   GALAXY FALLING SCENE
   Sau 10 giây thay toàn bộ giao diện hiện tại bằng thiên hà + chữ rơi
========================================================= */

#fallingScene {
    position: fixed;
    inset: 0;
    z-index: 50;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    background:
        radial-gradient(ellipse at 50% 50%, rgba(105, 25, 150, .20) 0%, rgba(30, 5, 55, .16) 28%, rgba(0,0,0,.94) 72%),
        radial-gradient(ellipse at 15% 30%, rgba(255, 45, 170, .09), transparent 40%),
        radial-gradient(ellipse at 85% 70%, rgba(60, 70, 255, .08), transparent 40%),
        #000;
    transition: opacity 1.8s ease, visibility 1.8s ease;
}

#fallingScene.active {
    opacity: 1;
    visibility: visible;
}

#app.scene-replaced canvas,
#app.scene-replaced .message {
    opacity: 0;
    transition: opacity 1.8s ease;
    pointer-events: none;
}

.galaxy-nebula {
    position: absolute;
    inset: -30%;
    background:
        radial-gradient(ellipse at 50% 50%, transparent 0 18%, rgba(255, 0, 180, .09) 30%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, transparent 0 34%, rgba(100, 40, 255, .08) 44%, transparent 66%);
    transform: rotate(-16deg) scale(1.12);
    filter: blur(24px);
    animation: galaxyDrift 20s ease-in-out infinite alternate;
}

@keyframes galaxyDrift {
    from { transform: rotate(-16deg) scale(1.12) translate3d(-2%, -1%, 0); }
    to { transform: rotate(-11deg) scale(1.22) translate3d(2%, 1%, 0); }
}

#effectsCanvas,
#galaxyStars,
#fallingMessages {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

#effectsCanvas {
    z-index: 2;
    pointer-events: none;
}

#galaxyStars { z-index: 1; }
#fallingMessages { z-index: 3; }

#fallingMessages.hug-transition {
    opacity: 0;
    transition: opacity 1.8s ease;
}

.galaxy-star {
    position: absolute;
    width: 1.5px;
    height: 1.5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 4px rgba(255,255,255,.9), 0 0 9px rgba(190,120,255,.45);
    animation: starTwinkle var(--twinkle) ease-in-out infinite alternate;
}

@keyframes starTwinkle {
    from { opacity: .18; transform: scale(.65); }
    to { opacity: .85; transform: scale(1.25); }
}

.galaxy-core {
    position: absolute;
    left: 50%;
    top: 52%;
    width: min(78vw, 900px);
    height: min(19vw, 220px);
    transform: translate(-50%, -50%) rotate(-14deg);
    border-radius: 50%;
    background: radial-gradient(ellipse,
        rgba(255,255,255,.48) 0%,
        rgba(255,105,205,.22) 10%,
        rgba(155,35,190,.12) 32%,
        transparent 68%);
    filter: blur(22px);
    opacity: .68;
}

/* Chữ nhỏ hơn, thưa hơn và không chồng quá nhiều */
.falling-message {
    position: absolute;
    top: -14vh;
    left: 0;
    white-space: nowrap;
    user-select: none;
    font-family: Arial, sans-serif;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .3px;
    color: var(--text-color);
    text-shadow:
        0 0 3px rgba(255,255,255,.8),
        0 0 8px var(--glow-color),
        0 0 18px var(--glow-color);
    opacity: 0;
    animation: fallingLoveText linear forwards;
    will-change: transform, opacity;
    mix-blend-mode: screen;
}

@keyframes fallingLoveText {
    0% {
        opacity: 0;
        transform: translate3d(var(--start-x), -14vh, 0) rotate(var(--rotate));
    }
    8% { opacity: var(--opacity); }
    82% { opacity: var(--opacity); }
    100% {
        opacity: 0;
        transform: translate3d(calc(var(--start-x) + var(--drift)), 118vh, 0) rotate(calc(var(--rotate) + var(--rotate-end)));
    }
}

@media (max-width: 600px) {
    .galaxy-core { width: 125vw; height: 30vw; }
    .galaxy-nebula { filter: blur(16px); }
    .falling-message {
        text-shadow: 0 0 3px rgba(255,255,255,.75), 0 0 7px var(--glow-color), 0 0 15px var(--glow-color);
    }
}


/* =========================================================
   COUPLE HUG SCENE
   Sau 20 giây chữ rơi: hai người xuất hiện và ôm nhau
========================================================= */

#hugScene {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transform: scale(.92);
    transition:
        opacity 2.2s ease,
        transform 2.8s cubic-bezier(.2,.8,.2,1),
        visibility 2.2s ease;
}

#hugScene.active {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

.hug-glow {
    position: absolute;
    width: min(60vw, 560px);
    height: min(60vw, 560px);
    border-radius: 50%;
    background:
        radial-gradient(circle,
            rgba(255, 130, 220, .25) 0%,
            rgba(180, 70, 255, .12) 32%,
            transparent 68%);
    filter: blur(18px);
    animation: hugGlow 3s ease-in-out infinite alternate;
}

@keyframes hugGlow {
    from {
        transform: scale(.88);
        opacity: .55;
    }
    to {
        transform: scale(1.08);
        opacity: .95;
    }
}

.hug-heart {
    position: absolute;
    top: 18%;
    left: 50%;
    width: 70px;
    height: 70px;
    transform: translateX(-50%) rotate(-45deg);
    background: #ff4fae;
    filter:
        drop-shadow(0 0 8px #ff4fae)
        drop-shadow(0 0 24px rgba(255, 55, 175, .85));
    animation: hugHeartBeat 1.5s ease-in-out infinite;
}

.hug-heart::before,
.hug-heart::after {
    content: "";
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #ff4fae;
}

.hug-heart::before {
    top: -35px;
    left: 0;
}

.hug-heart::after {
    top: 0;
    left: 35px;
}

@keyframes hugHeartBeat {
    0%, 100% {
        transform: translateX(-50%) rotate(-45deg) scale(.92);
    }
    15% {
        transform: translateX(-50%) rotate(-45deg) scale(1.08);
    }
    30% {
        transform: translateX(-50%) rotate(-45deg) scale(.98);
    }
}

.hug-couple {
    position: relative;
    width: min(70vw, 520px);
    height: min(70vh, 570px);
    filter:
        drop-shadow(0 0 12px rgba(255, 90, 190, .42))
        drop-shadow(0 0 32px rgba(150, 80, 255, .24));
}

.hug-couple svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.hug-couple .person {
    transform-box: fill-box;
    transform-origin: center bottom;
}

.hug-couple .person-left {
    animation: personLeft 3.2s ease-in-out infinite;
}

.hug-couple .person-right {
    animation: personRight 3.2s ease-in-out infinite;
}

@keyframes personLeft {
    0%, 100% { transform: translateX(-3px) rotate(-1deg); }
    50% { transform: translateX(3px) rotate(1deg); }
}

@keyframes personRight {
    0%, 100% { transform: translateX(3px) rotate(1deg); }
    50% { transform: translateX(-3px) rotate(-1deg); }
}

.hug-title {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    width: 90%;
    text-align: center;
    color: rgba(255, 224, 246, .95);
    font-size: clamp(17px, 3vw, 28px);
    font-weight: 600;
    letter-spacing: 3px;
    text-shadow:
        0 0 8px #ff4fae,
        0 0 20px #ff1493,
        0 0 42px rgba(170, 70, 255, .8);
    opacity: 0;
    animation: hugTitleIn 2s 1.1s ease forwards;
}

@keyframes hugTitleIn {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

.hug-spark {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
        0 0 6px #fff,
        0 0 16px #ff75c8;
    animation: hugSpark 2.8s ease-in-out infinite;
}

@keyframes hugSpark {
    0%, 100% {
        opacity: 0;
        transform: translateY(15px) scale(.5);
    }
    35% {
        opacity: 1;
    }
    70% {
        opacity: .75;
        transform: translateY(-35px) scale(1);
    }
}

</style>
</head>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<script type="module">

import * as THREE from "three";

import {
    EffectComposer
} from "three/addons/postprocessing/EffectComposer.js";

import {
    RenderPass
} from "three/addons/postprocessing/RenderPass.js";

import {
    UnrealBloomPass
} from "three/addons/postprocessing/UnrealBloomPass.js";

import {
    OutputPass
} from "three/addons/postprocessing/OutputPass.js";


/* =========================================================
   CONFIG
========================================================= */

const isMobile =
    window.innerWidth < 600;

const CONFIG = {

    // Hạt tạo thành trái tim
    heartParticles:
        isMobile
            ? 1200
            : 2200,

    // Sao nền
    stars:
        isMobile
            ? 350
            : 700,

    // Hạt mặt đất
    floorParticles:
        isMobile
            ? 1500
            : 2800,

    // Tim nhỏ bay xung quanh
    floatingParticles:
        isMobile
            ? 18
            : 40,

    // Thời gian sao băng hình thành trái tim
    formationDuration:
        isMobile
            ? 4.2
            : 4.8,

    // Độ dài đuôi sao băng
    meteorTrail:
        isMobile
            ? 1.0
            : 1.35,

    // Vệ tinh / tiểu hành tinh phát sáng xung quanh trái tim
    satellites:
        isMobile
            ? 7
            : 11
};


/* =========================================================
   BASIC
========================================================= */

const canvas =
    document.getElementById("canvas");

const loading =
    document.getElementById("loading");


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    1.5,
    isMobile
        ? 24
        : 22
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        isMobile ? 1.5 : 2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    .9;


/* =========================================================
   BLOOM
========================================================= */

const composer =
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(
        scene,
        camera
    )
);

const bloom =
    new UnrealBloomPass(
        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),
        isMobile ? .28 : .48,
        isMobile ? .32 : .38,
        .08
    );

composer.addPass(bloom);

composer.addPass(
    new OutputPass()
);


/* =========================================================
   HEART GROUP
========================================================= */

const heartGroup =
    new THREE.Group();

scene.add(heartGroup);


/* =========================================================
   HEART FUNCTION
========================================================= */

function heartFunction(x, y) {

    const a =
        x * x +
        y * y -
        1;

    return (
        a * a * a -
        x * x *
        y * y *
        y
    );
}


/* =========================================================
   HEART METEORS
   Sao băng rơi từ trên xuống và ghép thành trái tim
========================================================= */

function createHeartMeteors() {

    const count =
        CONFIG.heartParticles;

    const targetPositions =
        new Float32Array(count * 3);

    const startPositions =
        new Float32Array(count * 3);

    const currentPositions =
        new Float32Array(count * 3);

    const colors =
        new Float32Array(count * 3);

    const sizes =
        new Float32Array(count);

    const randoms =
        new Float32Array(count);

    const delays =
        new Float32Array(count);

    const velocities =
        new Float32Array(count);

    let index = 0;

    const scale =
        isMobile ? 4.0 : 4.5;


    /*
     * Tạo ngẫu nhiên các điểm bên trong trái tim
     */
    while (index < count) {

        const x =
            THREE.MathUtils.randFloat(
                -1.5,
                1.5
            );

        const y =
            THREE.MathUtils.randFloat(
                -1.35,
                1.25
            );

        if (
            heartFunction(x, y) > 0
        ) {
            continue;
        }

        const nx =
            x / 1.5;

        const ny =
            y / 1.35;

        const center =
            Math.max(
                0,
                1 -
                Math.sqrt(
                    nx * nx +
                    ny * ny
                )
            );

        const depth =
            (
                Math.random() -
                .5
            ) *
            (
                .7 +
                center * 3.2
            );

        const noise =
            (
                Math.random() -
                .5
            ) * .06;

        const tx =
            x * scale +
            noise;

        const ty =
            y * scale +
            noise;

        const tz =
            depth;


        /*
         * Vị trí đích
         */
        targetPositions[index * 3] =
            tx;

        targetPositions[index * 3 + 1] =
            ty;

        targetPositions[index * 3 + 2] =
            tz;


        /*
         * Sao băng bắt đầu phía trên màn hình.
         *
         * X gần với vị trí đích nhưng có độ lệch lớn,
         * để nhìn giống mưa sao băng.
         */
        const sx =
            tx +
            THREE.MathUtils.randFloat(
                -5.5,
                5.5
            );

        const sy =
            THREE.MathUtils.randFloat(
                9.0,
                17.0
            );

        const sz =
            tz +
            THREE.MathUtils.randFloat(
                -5,
                4
            );

        startPositions[index * 3] =
            sx;

        startPositions[index * 3 + 1] =
            sy;

        startPositions[index * 3 + 2] =
            sz;

        currentPositions[index * 3] =
            sx;

        currentPositions[index * 3 + 1] =
            sy;

        currentPositions[index * 3 + 2] =
            sz;


        /*
         * Điểm càng thấp thì rơi trước.
         * Sau đó lần lượt tạo phần trên của trái tim.
         */
        const verticalOrder =
            THREE.MathUtils.clamp(
                (1.15 - y) / 2.5,
                0,
                1
            );

        delays[index] =
            verticalOrder *
            .52 +
            Math.random() *
            .22;


        /*
         * Vận tốc mỗi sao băng
         */
        velocities[index] =
            THREE.MathUtils.randFloat(
                .85,
                1.2
            );


        /*
         * Kích thước đầu sao băng
         */
        sizes[index] =
            THREE.MathUtils.randFloat(
                .45,
                1.8
            );


        randoms[index] =
            Math.random();


        /*
         * Màu hồng neon
         */
        const color =
            new THREE.Color();

        const r =
            Math.random();

        if (r < .55) {

            color.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .05,
                    .28
                ),
                THREE.MathUtils.randFloat(
                    .28,
                    .62
                )
            );

        } else {

            color.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .25,
                    .65
                ),
                THREE.MathUtils.randFloat(
                    .55,
                    .95
                )
            );
        }

        colors[index * 3] =
            color.r;

        colors[index * 3 + 1] =
            color.g;

        colors[index * 3 + 2] =
            color.b;

        index++;
    }


    /* =====================================================
       METEOR HEADS
    ===================================================== */

    const headGeometry =
        new THREE.BufferGeometry();

    headGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            currentPositions,
            3
        )
    );

    headGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );

    headGeometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(
            sizes,
            1
        )
    );

    headGeometry.setAttribute(
        "aRandom",
        new THREE.BufferAttribute(
            randoms,
            1
        )
    );

    headGeometry.setAttribute(
        "aDelay",
        new THREE.BufferAttribute(
            delays,
            1
        )
    );


    const headMaterial =
        new THREE.ShaderMaterial({

            transparent: true,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            vertexColors: true,

            uniforms: {
                uTime: {
                    value: 0
                },

                uFormation: {
                    value: 0
                }
            },

            vertexShader: `

                attribute float aSize;
                attribute float aRandom;
                attribute float aDelay;

                uniform float uTime;
                uniform float uFormation;

                varying vec3 vColor;
                varying float vRandom;
                varying float vProgress;

                void main() {

                    vec3 p =
                        position;

                    float localProgress =
                        clamp(
                            (
                                uFormation -
                                aDelay
                            ) /
                            (1.0 - aDelay),
                            0.0,
                            1.0
                        );

                    /*
                     * Ease-out:
                     * rơi nhanh rồi chậm lại khi chạm tim
                     */
                    float eased =
                        1.0 -
                        pow(
                            1.0 -
                            localProgress,
                            3.0
                        );

                    /*
                     * Tạm thời vẫn dùng position
                     * vì JS cập nhật currentPositions.
                     */

                    float glowScale =
                        1.0 +
                        (
                            1.0 -
                            localProgress
                        ) * .55;

                    vec4 mvPosition =
                        modelViewMatrix *
                        vec4(p, 1.0);

                    gl_PointSize =
                        aSize *
                        glowScale *
                        (
                            230.0 /
                            -mvPosition.z
                        );

                    gl_Position =
                        projectionMatrix *
                        mvPosition;

                    vColor =
                        color;

                    vRandom =
                        aRandom;

                    vProgress =
                        localProgress;
                }
            `,

            fragmentShader: `

                varying vec3 vColor;
                varying float vRandom;
                varying float vProgress;

                void main() {

                    vec2 uv =
                        gl_PointCoord -
                        .5;

                    float d =
                        length(uv);

                    if (d > .5) {
                        discard;
                    }

                    float glow =
                        1.0 -
                        smoothstep(
                            0.0,
                            .5,
                            d
                        );

                    float brightness =
                        .8 +
                        fract(
                            vRandom * 13.7
                        ) * .8;

                    /*
                     * Đầu sao băng rất sáng
                     */
                    brightness *=
                        1.0 +
                        (1.0 - vProgress) *
                        .7;

                    vec3 finalColor =
                        vColor *
                        brightness;

                    finalColor +=
                        vec3(
                            1.0,
                            .04,
                            .2
                        ) *
                        glow *
                        .08;

                    gl_FragColor =
                        vec4(
                            finalColor,
                            glow
                        );
                }
            `
        });


    const heads =
        new THREE.Points(
            headGeometry,
            headMaterial
        );

    heartGroup.add(heads);


    /* =====================================================
       METEOR TRAILS
    ===================================================== */

    const trailPositions =
        new Float32Array(
            count * 2 * 3
        );

    const trailColors =
        new Float32Array(
            count * 2 * 3
        );


    for (let i = 0; i < count; i++) {

        const px =
            currentPositions[i * 3];

        const py =
            currentPositions[i * 3 + 1];

        const pz =
            currentPositions[i * 3 + 2];

        trailPositions[i * 6] =
            px;

        trailPositions[i * 6 + 1] =
            py;

        trailPositions[i * 6 + 2] =
            pz;

        trailPositions[i * 6 + 3] =
            px;

        trailPositions[i * 6 + 4] =
            py +
            CONFIG.meteorTrail;

        trailPositions[i * 6 + 5] =
            pz;


        const r =
            colors[i * 3];

        const g =
            colors[i * 3 + 1];

        const b =
            colors[i * 3 + 2];

        trailColors[i * 6] =
            r;

        trailColors[i * 6 + 1] =
            g;

        trailColors[i * 6 + 2] =
            b;

        trailColors[i * 6 + 3] =
            r * .18;

        trailColors[i * 6 + 4] =
            g * .18;

        trailColors[i * 6 + 5] =
            b * .18;
    }


    const trailGeometry =
        new THREE.BufferGeometry();

    trailGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            trailPositions,
            3
        )
    );

    trailGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            trailColors,
            3
        )
    );


    const trailMaterial =
        new THREE.LineBasicMaterial({

            vertexColors: true,

            transparent: true,

            opacity: .7,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            linewidth: 1
        });


    const trails =
        new THREE.LineSegments(
            trailGeometry,
            trailMaterial
        );

    heartGroup.add(trails);


    /*
     * Hàm update được gọi mỗi frame
     */
    function update(time, formation) {

        for (let i = 0; i < count; i++) {

            const delay =
                delays[i];

            let progress =
                THREE.MathUtils.clamp(
                    (
                        formation -
                        delay
                    ) /
                    (1 - delay),
                    0,
                    1
                );

            /*
             * Ease-out
             */
            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );


            const sx =
                startPositions[i * 3];

            const sy =
                startPositions[i * 3 + 1];

            const sz =
                startPositions[i * 3 + 2];

            const tx =
                targetPositions[i * 3];

            const ty =
                targetPositions[i * 3 + 1];

            const tz =
                targetPositions[i * 3 + 2];


            /*
             * Đường rơi có một chút cong/ngẫu nhiên.
             */
            const curve =
                Math.sin(
                    progress *
                    Math.PI
                ) *
                (
                    .15 +
                    randoms[i] * .25
                );


            const x =
                THREE.MathUtils.lerp(
                    sx,
                    tx,
                    eased
                ) +
                curve *
                Math.sin(
                    randoms[i] * 20
                );


            const y =
                THREE.MathUtils.lerp(
                    sy,
                    ty,
                    eased
                );


            const z =
                THREE.MathUtils.lerp(
                    sz,
                    tz,
                    eased
                );


            currentPositions[i * 3] =
                x;

            currentPositions[i * 3 + 1] =
                y;

            currentPositions[i * 3 + 2] =
                z;


            /*
             * Đuôi sao băng hướng ngược chiều rơi.
             */
            const tailLength =
                CONFIG.meteorTrail *
                (
                    1 -
                    progress * .72
                );


            trailPositions[i * 6] =
                x;

            trailPositions[i * 6 + 1] =
                y;

            trailPositions[i * 6 + 2] =
                z;

            trailPositions[i * 6 + 3] =
                x;

            trailPositions[i * 6 + 1] =
                y +
                tailLength;

            trailPositions[i * 6 + 2] =
                z;


            /*
             * Sau khi hạt chạm trái tim,
             * đuôi biến mất.
             */
            const alpha =
                progress < 1
                    ? 1
                    : 0;

            trailColors[i * 6 + 3] =
                colors[i * 3] *
                .18 *
                alpha;

            trailColors[i * 6 + 4] =
                colors[i * 3 + 1] *
                .18 *
                alpha;

            trailColors[i * 6 + 5] =
                colors[i * 3 + 2] *
                .18 *
                alpha;
        }


        headGeometry.attributes.position.needsUpdate =
            true;

        trailGeometry.attributes.position.needsUpdate =
            true;

        trailGeometry.attributes.color.needsUpdate =
            true;


        headMaterial.uniforms.uTime.value =
            time;

        headMaterial.uniforms.uFormation.value =
            formation;

        /*
         * Khi hình thành xong:
         * sao băng tắt, hạt tim tiếp tục phát sáng.
         */
        trailMaterial.opacity =
            Math.max(
                0,
                1 -
                formation
            ) * .72;
    }


    return {
        heads,
        trails,
        update
    };
}

    ctx.clearRect(
        0,
        0,
        512,
        100
    );

    ctx.font =
        "bold 32px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.shadowColor =
        "#ff1493";

            );

function createSatelliteTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createRadialGradient(
            64,
            58,
            5,
            64,
            64,
            58
        );

    gradient.addColorStop(
        0,
        "rgba(255,220,250,1)"
    );

    gradient.addColorStop(
        .2,
        "rgba(255,95,190,.98)"
    );

    gradient.addColorStop(
        .58,
        "rgba(150,20,130,.75)"
    );

    gradient.addColorStop(
        1,
        "rgba(20,0,35,1)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        64,
        64,
        48,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Bề mặt hành tinh
     */
    for (let i = 0; i < 28; i++) {

        const x =
            THREE.MathUtils.randFloat(
                20,
                108
            );

        const y =
            THREE.MathUtils.randFloat(
                20,
                108
            );

        const radius =
            THREE.MathUtils.randFloat(
                1,
                7
            );

        ctx.fillStyle =
            `rgba(255,120,220,${THREE.MathUtils.randFloat(.08,.28)})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    return new THREE.CanvasTexture(
        canvas
    );
}

        const vertical =
            THREE.MathUtils.randFloat(
                -1.2,
                5.8
            );


        const angle =
            (
                i /
                CONFIG.satellites
            ) *
            Math.PI *
            2 +
            THREE.MathUtils.randFloat(
                -.4,
                .4
            );


        const speed =
            THREE.MathUtils.randFloat(
                .055,
                .14
            ) *
            (
                i % 2 === 0
                    ? 1
                    : -1
            );


        const tilt =
            THREE.MathUtils.randFloat(
                -.55,
                .55
            );


        const phase =
            Math.random() *
            Math.PI *
            2;


        group.add(
            planet
        );


        satelliteData.push({

            object:
                planet,

            ring,

            radiusX,

            radiusZ,

            vertical,

            angle,

            speed,

            tilt,

            phase,

            size
        });
    }


    /*
     * Một số đường quỹ đạo cực mờ để tạo cảm giác
     * các vệ tinh thực sự đang bay trong không gian.
     */
    function createOrbitLine(
        radiusX,
        radiusZ,
        y,
        rotation
    ) {

        const points = [];

        const segments = 100;

        for (
            let i = 0;
            i <= segments;
            i++
        ) {

            const angle =
                (
                    i /
                    segments
                ) *
                Math.PI *
                2;

            points.push(
                new THREE.Vector3(
                    Math.cos(angle) *
                    radiusX,

                    y,

                    Math.sin(angle) *
                    radiusZ
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const material =
            new THREE.LineBasicMaterial({

                color:
                    0xff2aaa,

                transparent:
                    true,

                opacity:
                    .055,

                depthWrite:
                    false,

                blending:
                    THREE.AdditiveBlending
            });


        const line =
            new THREE.Line(
                geometry,
                material
            );


        line.rotation.z =
            rotation;

        group.add(line);
    }


    createOrbitLine(
        8.8,
        3.6,
        1.5,
        -.2
    );

    createOrbitLine(
        10.5,
        4.7,
        3.7,
        .35
    );

    createOrbitLine(
        7.2,
        5.2,
        -1.0,
        -.5
    );


    function update(time) {

        satelliteData.forEach(
            data => {

                data.angle +=
                    data.speed *
                    .012;


                const a =
                    data.angle;


                let x =
                    Math.cos(a) *
                    data.radiusX;

                let z =
                    Math.sin(a) *
                    data.radiusZ;


                /*
                 * Tilt quỹ đạo.
                 */
                const tiltedY =
                    Math.sin(a) *
                    data.radiusZ *
                    Math.sin(
                        data.tilt
                    );


                const y =
                    data.vertical +
                    tiltedY;


                /*
                 * Một chút chuyển động nổi.
                 */
                const floating =
                    Math.sin(
                        time *
                        .45 +
                        data.phase
                    ) *
                    .22;


                data.object.position.set(
                    x,
                    y + floating,
                    z
                );


                /*
                 * Vệ tinh quay nhẹ.
                 */
                data.object.material.opacity =
                    .58 +
                    (
                        Math.sin(
                            time *
                            1.3 +
                            data.phase
                        ) + 1
                    ) *
                    .16;


                if (data.ring) {

                    data.ring.rotation.z +=
                        .0009;

                    data.ring.material.opacity =
                        .38 +
                        (
                            Math.sin(
                                time *
                                .9 +
                                data.phase
                            ) + 1
                        ) *
                        .12;
                }


                /*
                 * Vệ tinh lớn hơn khi ở gần camera.
                 */
                const depthScale =
                    THREE.MathUtils.clamp(
                        1 -
                        z / 20,
                        .72,
                        1.3
                    );


                data.object.scale.set(
                    data.size *
                    depthScale,

                    data.size *
                    depthScale,

                    1
                );
            }
        );


        /*
         * Toàn bộ hệ vệ tinh quay rất chậm,
         * tạo cảm giác không gian 3D.
         */
        group.rotation.y =
            time * .012;

        group.rotation.x =
            Math.sin(
                time * .08
            ) * .025;
    }


    return {
        group,
        update
    };
}

function createSmallHeartTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.translate(
        64,
        64
    );

    ctx.scale(
        1.3,
        1.3
    );

    ctx.beginPath();

    ctx.moveTo(
        0,
        35
    );

    ctx.bezierCurveTo(
        -50,
        0,
        -35,
        -35,
        -12,
        -35
    );

    ctx.bezierCurveTo(
        -3,
        -35,
        0,
        -25,
        0,
        -18
    );

    ctx.bezierCurveTo(
        0,
        -25,
        3,
        -35,
        12,
        -35
    );

    ctx.bezierCurveTo(
        35,
        -35,
        50,
        0,
        0,
        35
    );

    ctx.closePath();

    ctx.shadowColor =
        "#ff1493";

    ctx.shadowBlur =
        20;

    ctx.fillStyle =
        "#ff4bb2";

    ctx.fill();

    return new THREE.CanvasTexture(
        canvas
    );
}

/* =========================================================
   MOUSE / TOUCH ROTATION
========================================================= */

let isDragging = false;

let lastX = 0;
let lastY = 0;

let targetRotationY = 0;
let targetRotationX = 0;

let currentRotationY = 0;
let currentRotationX = 0;


canvas.addEventListener(
    "pointerdown",
    event => {

        isDragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        canvas.setPointerCapture(
            event.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!isDragging) {
            return;
        }

        const dx =
            event.clientX -
            lastX;

        const dy =
            event.clientY -
            lastY;

        targetRotationY +=
            dx * .008;

        targetRotationX +=
            dy * .004;

        targetRotationX =
            THREE.MathUtils.clamp(
                targetRotationX,
                -.45,
                .45
            );

        lastX =
            event.clientX;

        lastY =
            event.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    () => {
        isDragging = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {
        isDragging = false;
    }
);

function createFallingMessage() {
    const element = document.createElement("div");
    const message = fallingMessageTexts[Math.floor(Math.random() * fallingMessageTexts.length)];
    const width = window.innerWidth;
    const height = window.innerHeight;

    /* Nhỏ hơn trước: chủ yếu 12–28px, chỉ thỉnh thoảng 30–40px */
    let fontSize;
    const randomSize = Math.random();

    if (randomSize < .08) {
        fontSize = THREE.MathUtils.randFloat(30, 40);
    } else if (randomSize < .28) {
        fontSize = THREE.MathUtils.randFloat(22, 29);
    } else {
        fontSize = THREE.MathUtils.randFloat(13, 21);
    }

    if (width < 600) {
        fontSize *= .78;
    }

    /* Rơi chậm hơn để các câu có khoảng cách */
    const duration = THREE.MathUtils.randFloat(10, 15.5);

    /* Chia màn hình thành nhiều lane để chữ không tụ vào một chỗ */
    const laneCount = width < 600 ? 5 : 7;
    const lane = Math.floor(Math.random() * laneCount);
    const laneWidth = width / laneCount;
    const startX = lane * laneWidth + THREE.MathUtils.randFloat(-laneWidth * .12, laneWidth * .12);

    /* Rơi chéo rõ hơn nhưng nhẹ */
    const diagonalDirection = Math.random() > .5 ? 1 : -1;
    const drift = diagonalDirection * THREE.MathUtils.randFloat(width * .12, width * .28);
    const rotate = THREE.MathUtils.randFloat(-7, 7);
    const rotateEnd = diagonalDirection * THREE.MathUtils.randFloat(5, 13);
    const opacity = THREE.MathUtils.randFloat(.42, .76);

    const [textColor, glowColor] = fallingTextColors[
        Math.floor(Math.random() * fallingTextColors.length)
    ];

    element.className = "falling-message";
    element.textContent = message;
    element.style.fontSize = `${fontSize}px`;
    element.style.setProperty("--start-x", `${startX}px`);
    element.style.setProperty("--drift", `${drift}px`);
    element.style.setProperty("--rotate", `${rotate}deg`);
    element.style.setProperty("--rotate-end", `${rotateEnd}deg`);
    element.style.setProperty("--opacity", opacity);
    element.style.setProperty("--text-color", textColor);
    element.style.setProperty("--glow-color", glowColor);
    element.style.animationDuration = `${duration}s`;

    element.style.top = `${THREE.MathUtils.randFloat(-22, -2)}vh`;

    element.addEventListener("animationend", () => element.remove(), { once: true });

========================================================= */

const effectsCanvas = document.getElementById("effectsCanvas");
const effectsCtx = effectsCanvas.getContext("2d");
let effectAnimationFrame = null;
let fireworks = [];
let meteors = [];
let lastFireworkTime = 0;
let lastMeteorTime = 0;

function resizeEffectsCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = fallingScene.getBoundingClientRect();
    effectsCanvas.width = Math.floor(rect.width * dpr);
    effectsCanvas.height = Math.floor(rect.height * dpr);
    effectsCanvas.style.width = rect.width + "px";
    effectsCanvas.style.height = rect.height + "px";
    effectsCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function randomEffectColor() {
    const colors = [
        [255, 92, 190],
        [190, 110, 255],
        [90, 190, 255],
        [255, 210, 90],
        [100, 240, 190],
        [255, 110, 125],
        [255, 150, 235]
    ];
    return colors[Math.floor(Math.random() * colors.length)];
}

function launchFirework(width, height) {
    const x = THREE.MathUtils.randFloat(width * .08, width * .92);
    const y = THREE.MathUtils.randFloat(height * .16, height * .58);
    const color = randomEffectColor();
    const count = window.innerWidth < 600 ? 32 : 52;
    const particles = [];

    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = THREE.MathUtils.randFloat(1.1, 3.5);
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: THREE.MathUtils.randFloat(.65, 1.25),
            maxLife: 1,
            size: THREE.MathUtils.randFloat(.8, 1.8),
            color
        });
    }

    fireworks.push({ particles });
}

function launchMeteor(width, height) {
    const fromLeft = Math.random() > .5;
    const x = fromLeft
        ? THREE.MathUtils.randFloat(-80, width * .55)
        : THREE.MathUtils.randFloat(width * .45, width + 80);
    const y = THREE.MathUtils.randFloat(-120, height * .2);
    const vx = fromLeft
        ? THREE.MathUtils.randFloat(1.8, 4.2)
        : THREE.MathUtils.randFloat(-4.2, -1.8);
    const vy = THREE.MathUtils.randFloat(3.2, 6.2);
    const color = randomEffectColor();

    meteors.push({
        x, y, vx, vy,
        life: THREE.MathUtils.randFloat(1.0, 2.0),
        maxLife: 2,
        length: THREE.MathUtils.randFloat(80, 170),
        color
    });
}

function drawEffects(time) {
    if (!fallingScene.classList.contains("active")) {
        effectAnimationFrame = requestAnimationFrame(drawEffects);
        return;
    }

    const width = fallingScene.clientWidth;
    const height = fallingScene.clientHeight;

    if (time - lastFireworkTime > THREE.MathUtils.randFloat(1500, 2600)) {
        launchFirework(width, height);
        lastFireworkTime = time;
    }

    if (time - lastMeteorTime > THREE.MathUtils.randFloat(900, 1800)) {
        launchMeteor(width, height);
        lastMeteorTime = time;
    }

    effectsCtx.clearRect(0, 0, width, height);
    effectsCtx.globalCompositeOperation = "lighter";

    fireworks = fireworks.filter(firework => {
        let alive = false;

        firework.particles.forEach(p => {
            p.life -= 0.016;
            if (p.life <= 0) return;
            alive = true;

            p.vy += 0.035;
            p.x += p.vx;
            p.y += p.vy;

            const alpha = Math.max(0, p.life / p.maxLife);
            const [r, g, b] = p.color;
            effectsCtx.beginPath();
            effectsCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            effectsCtx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
            effectsCtx.shadowBlur = 10;
            effectsCtx.shadowColor = `rgb(${r},${g},${b})`;
            effectsCtx.fill();
        });

        return alive;
    });

    meteors = meteors.filter(m => {
        m.life -= 0.016;
        if (m.life <= 0) return false;

        m.x += m.vx;
        m.y += m.vy;

        const alpha = Math.min(1, m.life / .35);
        const [r, g, b] = m.color;
        const len = m.length;
        const speed = Math.hypot(m.vx, m.vy);
        const tx = m.x - (m.vx / speed) * len;
        const ty = m.y - (m.vy / speed) * len;

        const gradient = effectsCtx.createLinearGradient(tx, ty, m.x, m.y);
        gradient.addColorStop(0, `rgba(${r},${g},${b},0)`);
        gradient.addColorStop(.65, `rgba(${r},${g},${b},${alpha * .35})`);
        gradient.addColorStop(1, `rgba(255,255,255,${alpha})`);

        effectsCtx.beginPath();
        effectsCtx.moveTo(tx, ty);
        effectsCtx.lineTo(m.x, m.y);
        effectsCtx.strokeStyle = gradient;
        effectsCtx.lineWidth = THREE.MathUtils.randFloat(1, 2.5);
        effectsCtx.shadowBlur = 12;
        effectsCtx.shadowColor = `rgb(${r},${g},${b})`;
        effectsCtx.stroke();

        return m.y < height + 200;
    });

    effectsCtx.shadowBlur = 0;
    effectsCtx.globalCompositeOperation = "source-over";
    effectAnimationFrame = requestAnimationFrame(drawEffects);
}

/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* =====================================================
       FORMATION
       0 = chưa có tim
       1 = tim hoàn chỉnh
    ===================================================== */

    const formation =
        THREE.MathUtils.clamp(
            time /
            CONFIG.formationDuration,
            0,
            1
        );


    /*
     * Sao băng rơi xuống tạo trái tim
     */
    heartMeteorSystem.update(
        time,
        formation
    );

    /*
     * Vệ tinh / hành tinh xung quanh trái tim
     */
    satelliteSystem.update(
        time
    );


    /* =====================================================
       AUTO ROTATE
    ===================================================== */

    if (!isDragging) {

        targetRotationY +=
            .0018;
    }


    currentRotationY +=
        (
            targetRotationY -
            currentRotationY
        ) * .04;

    currentRotationX +=
        (
            targetRotationX -
            currentRotationX
        ) * .04;


    heartGroup.rotation.y =
        currentRotationY;

    heartGroup.rotation.x =
        currentRotationX;


    /* =====================================================
       HEARTBEAT
    ===================================================== */

    const beat =
        1 +
        Math.pow(
            Math.max(
                0,
                Math.sin(
                    time * 2.5
                )
            ),
            10
        ) *
        .035;


    heartMeteorSystem.heads.scale.set(
        beat,
        beat,
        beat
    );


    /*
     * Sau khi tim hoàn chỉnh,
     * cho tim sáng nhấp nháy nhẹ.
     */
    heartMeteorSystem.heads.material.opacity =
        .7 +
        Math.sin(
            time * 2
        ) * .12;


    /* =====================================================
       STARS
    ===================================================== */

    stars.rotation.y =
        time * .003;


    /* =====================================================
       FLOOR
    ===================================================== */

    floor.rotation.y =
        time * .012;


    /* =====================================================
       TEXT RING
    ===================================================== */

    textGroup.rotation.y =
        time * .045;


    /* =====================================================
       FLOATING HEARTS
    ===================================================== */

    floatingHearts
        .children
        .forEach(
            sprite => {

                const data =
                    sprite.userData;

                data.angle +=
                    data.speed *
                    .003;

                sprite.position.x =
                    Math.cos(
                        data.angle
                    ) *
                    data.radius;

                sprite.position.z =
                    Math.sin(
                        data.angle
                    ) *
                    data.radius;

                sprite.position.y =
                    data.y +
                    Math.sin(
                        time * 1.2 +
                        data.phase
                    ) *
                    .45;

                sprite.material.opacity =
                    .25 +
                    (
                        Math.sin(
                            time * 2 +
                            data.phase
                        ) + 1
                    ) * .25;
            }
        );


    /* =====================================================
       CAMERA
    ===================================================== */

    camera.position.y =
        1.5 +
        Math.sin(
            time * .25
        ) * .12;

    camera.lookAt(
        0,
        0,
        0
    );


    /* =====================================================
       RENDER
    ===================================================== */

    composer.render();
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (fallingScene.classList.contains("active")) resizeEffectsCanvas();

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;

        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();

        renderer.setSize(
            width,
            height
        );

        composer.setSize(
            width,
            height
        );

        bloom.resolution.set(
            width,
            height
        );
    }
);


/* =========================================================
   START
========================================================= */

setTimeout(
    () => {

        loading.classList.add(
            "hide"
        );

    },
    500
);

</script>

</body>
