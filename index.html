<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Anniversary 3D</title>
<link rel="icon" type="image/x-icon" href="images/heart.png">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #000;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #ff63b8;
    font-size: 12px;
    letter-spacing: 5px;
    transition: opacity 1s ease, visibility 1s ease;
}

#loading.hide {
    opacity: 0;
    visibility: hidden;
}

.message {
    position: fixed;
    left: 50%;
    bottom: 7%;
    transform: translateX(-50%);
    z-index: 5;
    color: rgba(255, 160, 220, .75);
    font-size: clamp(11px, 2vw, 16px);
    letter-spacing: 4px;
    white-space: nowrap;
    pointer-events: none;
    text-shadow:
        0 0 8px #ff1493,
        0 0 18px #ff1493;
}
</style>
</head>

<body>

<div id="app">
    <div id="loading">LOADING LOVE...</div>

    <canvas id="canvas"></canvas>

    <div class="message">
        HAPPY ANNIVERSARY ❤️
    </div>
</div>

<audio
    id="bgMusic"
    src="music.mp3"
    loop
    preload="auto"
></audio>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>

<script type="module">

import * as THREE from "three";

import {
    EffectComposer
} from "three/addons/postprocessing/EffectComposer.js";

import {
    RenderPass
} from "three/addons/postprocessing/RenderPass.js";

import {
    UnrealBloomPass
} from "three/addons/postprocessing/UnrealBloomPass.js";

import {
    OutputPass
} from "three/addons/postprocessing/OutputPass.js";


/* =========================================================
   CONFIG
========================================================= */

const isMobile =
    window.innerWidth < 600;

const CONFIG = {

    // Hạt tạo thành trái tim
    heartParticles:
        isMobile
            ? 1200
            : 2200,

    // Sao nền
    stars:
        isMobile
            ? 350
            : 700,

    // Hạt mặt đất
    floorParticles:
        isMobile
            ? 1500
            : 2800,

    // Tim nhỏ bay xung quanh
    floatingParticles:
        isMobile
            ? 18
            : 40,

    // Thời gian sao băng hình thành trái tim
    formationDuration:
        isMobile
            ? 4.2
            : 4.8,

    // Độ dài đuôi sao băng
    meteorTrail:
        isMobile
            ? 1.0
            : 1.35,

    // Vệ tinh / tiểu hành tinh phát sáng xung quanh trái tim
    satellites:
        isMobile
            ? 7
            : 11
};


/* =========================================================
   BASIC
========================================================= */

const canvas =
    document.getElementById("canvas");

const loading =
    document.getElementById("loading");


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    1.5,
    isMobile
        ? 24
        : 22
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        powerPreference: "high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        isMobile ? 1.5 : 2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    .9;


/* =========================================================
   BLOOM
========================================================= */

const composer =
    new EffectComposer(renderer);

composer.addPass(
    new RenderPass(
        scene,
        camera
    )
);

const bloom =
    new UnrealBloomPass(
        new THREE.Vector2(
            window.innerWidth,
            window.innerHeight
        ),
        isMobile ? .28 : .48,
        isMobile ? .32 : .38,
        .08
    );

composer.addPass(bloom);

composer.addPass(
    new OutputPass()
);


/* =========================================================
   HEART GROUP
========================================================= */

const heartGroup =
    new THREE.Group();

scene.add(heartGroup);


/* =========================================================
   HEART FUNCTION
========================================================= */

function heartFunction(x, y) {

    const a =
        x * x +
        y * y -
        1;

    return (
        a * a * a -
        x * x *
        y * y *
        y
    );
}


/* =========================================================
   HEART METEORS
   Sao băng rơi từ trên xuống và ghép thành trái tim
========================================================= */

function createHeartMeteors() {

    const count =
        CONFIG.heartParticles;

    const targetPositions =
        new Float32Array(count * 3);

    const startPositions =
        new Float32Array(count * 3);

    const currentPositions =
        new Float32Array(count * 3);

    const colors =
        new Float32Array(count * 3);

    const sizes =
        new Float32Array(count);

    const randoms =
        new Float32Array(count);

    const delays =
        new Float32Array(count);

    const velocities =
        new Float32Array(count);

    let index = 0;

    const scale =
        isMobile ? 4.0 : 4.5;


    /*
     * Tạo ngẫu nhiên các điểm bên trong trái tim
     */
    while (index < count) {

        const x =
            THREE.MathUtils.randFloat(
                -1.5,
                1.5
            );

        const y =
            THREE.MathUtils.randFloat(
                -1.35,
                1.25
            );

        if (
            heartFunction(x, y) > 0
        ) {
            continue;
        }

        const nx =
            x / 1.5;

        const ny =
            y / 1.35;

        const center =
            Math.max(
                0,
                1 -
                Math.sqrt(
                    nx * nx +
                    ny * ny
                )
            );

        const depth =
            (
                Math.random() -
                .5
            ) *
            (
                .7 +
                center * 3.2
            );

        const noise =
            (
                Math.random() -
                .5
            ) * .06;

        const tx =
            x * scale +
            noise;

        const ty =
            y * scale +
            noise;

        const tz =
            depth;


        /*
         * Vị trí đích
         */
        targetPositions[index * 3] =
            tx;

        targetPositions[index * 3 + 1] =
            ty;

        targetPositions[index * 3 + 2] =
            tz;


        /*
         * Sao băng bắt đầu phía trên màn hình.
         *
         * X gần với vị trí đích nhưng có độ lệch lớn,
         * để nhìn giống mưa sao băng.
         */
        const sx =
            tx +
            THREE.MathUtils.randFloat(
                -5.5,
                5.5
            );

        const sy =
            THREE.MathUtils.randFloat(
                9.0,
                17.0
            );

        const sz =
            tz +
            THREE.MathUtils.randFloat(
                -5,
                4
            );

        startPositions[index * 3] =
            sx;

        startPositions[index * 3 + 1] =
            sy;

        startPositions[index * 3 + 2] =
            sz;

        currentPositions[index * 3] =
            sx;

        currentPositions[index * 3 + 1] =
            sy;

        currentPositions[index * 3 + 2] =
            sz;


        /*
         * Điểm càng thấp thì rơi trước.
         * Sau đó lần lượt tạo phần trên của trái tim.
         */
        const verticalOrder =
            THREE.MathUtils.clamp(
                (1.15 - y) / 2.5,
                0,
                1
            );

        delays[index] =
            verticalOrder *
            .52 +
            Math.random() *
            .22;


        /*
         * Vận tốc mỗi sao băng
         */
        velocities[index] =
            THREE.MathUtils.randFloat(
                .85,
                1.2
            );


        /*
         * Kích thước đầu sao băng
         */
        sizes[index] =
            THREE.MathUtils.randFloat(
                .45,
                1.8
            );


        randoms[index] =
            Math.random();


        /*
         * Màu hồng neon
         */
        const color =
            new THREE.Color();

        const r =
            Math.random();

        if (r < .55) {

            color.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .05,
                    .28
                ),
                THREE.MathUtils.randFloat(
                    .28,
                    .62
                )
            );

        } else {

            color.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .25,
                    .65
                ),
                THREE.MathUtils.randFloat(
                    .55,
                    .95
                )
            );
        }

        colors[index * 3] =
            color.r;

        colors[index * 3 + 1] =
            color.g;

        colors[index * 3 + 2] =
            color.b;

        index++;
    }


    /* =====================================================
       METEOR HEADS
    ===================================================== */

    const headGeometry =
        new THREE.BufferGeometry();

    headGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            currentPositions,
            3
        )
    );

    headGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );

    headGeometry.setAttribute(
        "aSize",
        new THREE.BufferAttribute(
            sizes,
            1
        )
    );

    headGeometry.setAttribute(
        "aRandom",
        new THREE.BufferAttribute(
            randoms,
            1
        )
    );

    headGeometry.setAttribute(
        "aDelay",
        new THREE.BufferAttribute(
            delays,
            1
        )
    );


    const headMaterial =
        new THREE.ShaderMaterial({

            transparent: true,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            vertexColors: true,

            uniforms: {
                uTime: {
                    value: 0
                },

                uFormation: {
                    value: 0
                }
            },

            vertexShader: `

                attribute float aSize;
                attribute float aRandom;
                attribute float aDelay;

                uniform float uTime;
                uniform float uFormation;

                varying vec3 vColor;
                varying float vRandom;
                varying float vProgress;

                void main() {

                    vec3 p =
                        position;

                    float localProgress =
                        clamp(
                            (
                                uFormation -
                                aDelay
                            ) /
                            (1.0 - aDelay),
                            0.0,
                            1.0
                        );

                    /*
                     * Ease-out:
                     * rơi nhanh rồi chậm lại khi chạm tim
                     */
                    float eased =
                        1.0 -
                        pow(
                            1.0 -
                            localProgress,
                            3.0
                        );

                    /*
                     * Tạm thời vẫn dùng position
                     * vì JS cập nhật currentPositions.
                     */

                    float glowScale =
                        1.0 +
                        (
                            1.0 -
                            localProgress
                        ) * .55;

                    vec4 mvPosition =
                        modelViewMatrix *
                        vec4(p, 1.0);

                    gl_PointSize =
                        aSize *
                        glowScale *
                        (
                            230.0 /
                            -mvPosition.z
                        );

                    gl_Position =
                        projectionMatrix *
                        mvPosition;

                    vColor =
                        color;

                    vRandom =
                        aRandom;

                    vProgress =
                        localProgress;
                }
            `,

            fragmentShader: `

                varying vec3 vColor;
                varying float vRandom;
                varying float vProgress;

                void main() {

                    vec2 uv =
                        gl_PointCoord -
                        .5;

                    float d =
                        length(uv);

                    if (d > .5) {
                        discard;
                    }

                    float glow =
                        1.0 -
                        smoothstep(
                            0.0,
                            .5,
                            d
                        );

                    float brightness =
                        .8 +
                        fract(
                            vRandom * 13.7
                        ) * .8;

                    /*
                     * Đầu sao băng rất sáng
                     */
                    brightness *=
                        1.0 +
                        (1.0 - vProgress) *
                        .7;

                    vec3 finalColor =
                        vColor *
                        brightness;

                    finalColor +=
                        vec3(
                            1.0,
                            .04,
                            .2
                        ) *
                        glow *
                        .08;

                    gl_FragColor =
                        vec4(
                            finalColor,
                            glow
                        );
                }
            `
        });


    const heads =
        new THREE.Points(
            headGeometry,
            headMaterial
        );

    heartGroup.add(heads);


    /* =====================================================
       METEOR TRAILS
    ===================================================== */

    const trailPositions =
        new Float32Array(
            count * 2 * 3
        );

    const trailColors =
        new Float32Array(
            count * 2 * 3
        );


    for (let i = 0; i < count; i++) {

        const px =
            currentPositions[i * 3];

        const py =
            currentPositions[i * 3 + 1];

        const pz =
            currentPositions[i * 3 + 2];

        trailPositions[i * 6] =
            px;

        trailPositions[i * 6 + 1] =
            py;

        trailPositions[i * 6 + 2] =
            pz;

        trailPositions[i * 6 + 3] =
            px;

        trailPositions[i * 6 + 4] =
            py +
            CONFIG.meteorTrail;

        trailPositions[i * 6 + 5] =
            pz;


        const r =
            colors[i * 3];

        const g =
            colors[i * 3 + 1];

        const b =
            colors[i * 3 + 2];

        trailColors[i * 6] =
            r;

        trailColors[i * 6 + 1] =
            g;

        trailColors[i * 6 + 2] =
            b;

        trailColors[i * 6 + 3] =
            r * .18;

        trailColors[i * 6 + 4] =
            g * .18;

        trailColors[i * 6 + 5] =
            b * .18;
    }


    const trailGeometry =
        new THREE.BufferGeometry();

    trailGeometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            trailPositions,
            3
        )
    );

    trailGeometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            trailColors,
            3
        )
    );


    const trailMaterial =
        new THREE.LineBasicMaterial({

            vertexColors: true,

            transparent: true,

            opacity: .7,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending,

            linewidth: 1
        });


    const trails =
        new THREE.LineSegments(
            trailGeometry,
            trailMaterial
        );

    heartGroup.add(trails);


    /*
     * Hàm update được gọi mỗi frame
     */
    function update(time, formation) {

        for (let i = 0; i < count; i++) {

            const delay =
                delays[i];

            let progress =
                THREE.MathUtils.clamp(
                    (
                        formation -
                        delay
                    ) /
                    (1 - delay),
                    0,
                    1
                );

            /*
             * Ease-out
             */
            const eased =
                1 -
                Math.pow(
                    1 - progress,
                    3
                );


            const sx =
                startPositions[i * 3];

            const sy =
                startPositions[i * 3 + 1];

            const sz =
                startPositions[i * 3 + 2];

            const tx =
                targetPositions[i * 3];

            const ty =
                targetPositions[i * 3 + 1];

            const tz =
                targetPositions[i * 3 + 2];


            /*
             * Đường rơi có một chút cong/ngẫu nhiên.
             */
            const curve =
                Math.sin(
                    progress *
                    Math.PI
                ) *
                (
                    .15 +
                    randoms[i] * .25
                );


            const x =
                THREE.MathUtils.lerp(
                    sx,
                    tx,
                    eased
                ) +
                curve *
                Math.sin(
                    randoms[i] * 20
                );


            const y =
                THREE.MathUtils.lerp(
                    sy,
                    ty,
                    eased
                );


            const z =
                THREE.MathUtils.lerp(
                    sz,
                    tz,
                    eased
                );


            currentPositions[i * 3] =
                x;

            currentPositions[i * 3 + 1] =
                y;

            currentPositions[i * 3 + 2] =
                z;


            /*
             * Đuôi sao băng hướng ngược chiều rơi.
             */
            const tailLength =
                CONFIG.meteorTrail *
                (
                    1 -
                    progress * .72
                );


            trailPositions[i * 6] =
                x;

            trailPositions[i * 6 + 1] =
                y;

            trailPositions[i * 6 + 2] =
                z;

            trailPositions[i * 6 + 3] =
                x;

            trailPositions[i * 6 + 1] =
                y +
                tailLength;

            trailPositions[i * 6 + 2] =
                z;


            /*
             * Sau khi hạt chạm trái tim,
             * đuôi biến mất.
             */
            const alpha =
                progress < 1
                    ? 1
                    : 0;

            trailColors[i * 6 + 3] =
                colors[i * 3] *
                .18 *
                alpha;

            trailColors[i * 6 + 4] =
                colors[i * 3 + 1] *
                .18 *
                alpha;

            trailColors[i * 6 + 5] =
                colors[i * 3 + 2] *
                .18 *
                alpha;
        }


        headGeometry.attributes.position.needsUpdate =
            true;

        trailGeometry.attributes.position.needsUpdate =
            true;

        trailGeometry.attributes.color.needsUpdate =
            true;


        headMaterial.uniforms.uTime.value =
            time;

        headMaterial.uniforms.uFormation.value =
            formation;

        /*
         * Khi hình thành xong:
         * sao băng tắt, hạt tim tiếp tục phát sáng.
         */
        trailMaterial.opacity =
            Math.max(
                0,
                1 -
                formation
            ) * .72;
    }


    return {
        heads,
        trails,
        update
    };
}


const heartMeteorSystem =
    createHeartMeteors();


/* =========================================================
   HEART POSITION
========================================================= */

heartGroup.position.y =
    isMobile
        ? 1.4
        : 1.3;


/* =========================================================
   BACKGROUND STARS
========================================================= */

function createStars() {

    const count =
        CONFIG.stars;

    const positions =
        new Float32Array(
            count * 3
        );

    const colors =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        positions[i * 3] =
            THREE.MathUtils.randFloat(
                -35,
                35
            );

        positions[i * 3 + 1] =
            THREE.MathUtils.randFloat(
                -25,
                30
            );

        positions[i * 3 + 2] =
            THREE.MathUtils.randFloat(
                -40,
                -8
            );


        const c =
            new THREE.Color();

        c.setRGB(
            1,
            THREE.MathUtils.randFloat(
                .5,
                1
            ),
            THREE.MathUtils.randFloat(
                .6,
                1
            )
        );

        colors[i * 3] =
            c.r;

        colors[i * 3 + 1] =
            c.g;

        colors[i * 3 + 2] =
            c.b;
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            size:
                isMobile
                    ? .055
                    : .07,

            vertexColors: true,

            transparent: true,

            opacity: .65,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending
        });


    const stars =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(stars);

    return stars;
}


const stars =
    createStars();


/* =========================================================
   FLOOR
========================================================= */

function createFloor() {

    const count =
        CONFIG.floorParticles;

    const positions =
        new Float32Array(
            count * 3
        );

    const colors =
        new Float32Array(
            count * 3
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const radius =
            Math.pow(
                Math.random(),
                .65
            ) * 8;

        const x =
            Math.cos(angle) *
            radius;

        const z =
            Math.sin(angle) *
            radius;

        const y =
            -4.0 -
            radius * .07;


        positions[i * 3] =
            x;

        positions[i * 3 + 1] =
            y;

        positions[i * 3 + 2] =
            z;


        const c =
            new THREE.Color();

        const r =
            Math.random();

        if (r < .65) {

            c.setRGB(
                1,
                THREE.MathUtils.randFloat(
                    .15,
                    .5
                ),
                THREE.MathUtils.randFloat(
                    .45,
                    .8
                )
            );

        } else {

            c.setRGB(
                THREE.MathUtils.randFloat(
                    .5,
                    1
                ),
                .7,
                1
            );
        }


        colors[i * 3] =
            c.r;

        colors[i * 3 + 1] =
            c.g;

        colors[i * 3 + 2] =
            c.b;
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
            positions,
            3
        )
    );

    geometry.setAttribute(
        "color",
        new THREE.BufferAttribute(
            colors,
            3
        )
    );


    const material =
        new THREE.PointsMaterial({

            size:
                isMobile
                    ? .055
                    : .07,

            vertexColors: true,

            transparent: true,

            opacity: .65,

            depthWrite: false,

            blending:
                THREE.AdditiveBlending
        });


    const floor =
        new THREE.Points(
            geometry,
            material
        );

    scene.add(floor);

    return floor;
}


const floor =
    createFloor();


/* =========================================================
   TEXT RING
========================================================= */

const textGroup =
    new THREE.Group();

scene.add(textGroup);

const messages = [

    "Yêu em mãi ❤️",
    "Cảm ơn em ❤️",
    "Anh yêu em ❤️",
    "Mãi bên nhau ❤️",
    "Love you ❤️",
    "Forever ❤️",
    "Yêu em nhiều ❤️",
    "My love ❤️"

];


function createTextTexture(text) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 100;

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,
        0,
        512,
        100
    );

    ctx.font =
        "bold 32px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.shadowColor =
        "#ff1493";

    ctx.shadowBlur =
        12;

    ctx.fillStyle =
        "rgba(255,255,255,.85)";

    ctx.fillText(
        text,
        256,
        50
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace =
        THREE.SRGBColorSpace;

    return texture;
}


function createTextRing() {

    const radius =
        isMobile
            ? 5.8
            : 7;


    messages.forEach(
        (
            message,
            index
        ) => {

            const texture =
                createTextTexture(
                    message
                );

            const material =
                new THREE.SpriteMaterial({

                    map:
                        texture,

                    transparent:
                        true,

                    opacity:
                        .75,

                    depthWrite:
                        false,

                    blending:
                        THREE.AdditiveBlending
                });


            const sprite =
                new THREE.Sprite(
                    material
                );


            const angle =
                (
                    index /
                    messages.length
                ) *
                Math.PI *
                2;


            sprite.position.x =
                Math.cos(angle) *
                radius;

            sprite.position.z =
                Math.sin(angle) *
                radius;

            sprite.position.y =
                -4.1;


            sprite.scale.set(
                isMobile
                    ? 3.3
                    : 3.2,

                isMobile
                    ? .65
                    : .62,

                1
            );

            sprite.rotation.y =
                -angle;

            textGroup.add(
                sprite
            );
        }
    );
}

createTextRing();



/* =========================================================
   SATELLITES / ORBITING PLANETS
   Các vệ tinh phát sáng quay quanh trái tim
========================================================= */

function createSatelliteTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    const gradient =
        ctx.createRadialGradient(
            64,
            58,
            5,
            64,
            64,
            58
        );

    gradient.addColorStop(
        0,
        "rgba(255,220,250,1)"
    );

    gradient.addColorStop(
        .2,
        "rgba(255,95,190,.98)"
    );

    gradient.addColorStop(
        .58,
        "rgba(150,20,130,.75)"
    );

    gradient.addColorStop(
        1,
        "rgba(20,0,35,1)"
    );

    ctx.fillStyle =
        gradient;

    ctx.beginPath();

    ctx.arc(
        64,
        64,
        48,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * Bề mặt hành tinh
     */
    for (let i = 0; i < 28; i++) {

        const x =
            THREE.MathUtils.randFloat(
                20,
                108
            );

        const y =
            THREE.MathUtils.randFloat(
                20,
                108
            );

        const radius =
            THREE.MathUtils.randFloat(
                1,
                7
            );

        ctx.fillStyle =
            `rgba(255,120,220,${THREE.MathUtils.randFloat(.08,.28)})`;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    return new THREE.CanvasTexture(
        canvas
    );
}


function createSatelliteRingTexture() {

}


function createSatelliteSystem() {

    const group =
        new THREE.Group();

    scene.add(group);

    const planetTexture =
        createSatelliteTexture();

    const ringTexture =
        createSatelliteRingTexture();


    /*
     * Các quỹ đạo vệ tinh không hiển thị
     * nhưng vệ tinh chuyển động theo các ellipse khác nhau.
     */
    const satelliteData = [];


    for (
        let i = 0;
        i < CONFIG.satellites;
        i++
    ) {

        const sizeFactor =
            Math.random();

        const isLarge =
            i === 0 ||
            (
                i === 1 &&
                !isMobile
            );


        const size =
            isLarge
                ? THREE.MathUtils.randFloat(
                    .65,
                    1.05
                )
                : THREE.MathUtils.randFloat(
                    .22,
                    .52
                );


        /*
         * Hành tinh
         */
        const planetMaterial =
            new THREE.SpriteMaterial({

                map:
                    planetTexture,

                color:
                    Math.random() > .45
                        ? 0xff42b5
                        : 0xd42cff,

                transparent:
                    true,

                opacity:
                    THREE.MathUtils.randFloat(
                        .62,
                        .92
                    ),

                depthWrite:
                    false,

                blending:
                    THREE.AdditiveBlending
            });


        const planet =
            new THREE.Sprite(
                planetMaterial
            );


        planet.scale.set(
            size,
            size,
            1
        );


        /*
         * Một số vệ tinh có vòng hành tinh.
         */
        const hasRing =
            isLarge ||
            Math.random() > .42;


        let ring = null;


        if (hasRing) {

            const ringMaterial =
                new THREE.SpriteMaterial({

                    map:
                        ringTexture,

                    color:
                        Math.random() > .5
                            ? 0xff55c8
                            : 0xa832ff,

                    transparent:
                        true,

                    opacity:
                        THREE.MathUtils.randFloat(
                            .45,
                            .8
                        ),

                    depthWrite:
                        false,

                    blending:
                        THREE.AdditiveBlending
                });


            ring =
                new THREE.Sprite(
                    ringMaterial
                );


            ring.scale.set(
                size * 2.8,
                size * .95,
                1
            );


            ring.rotation.z =
                THREE.MathUtils.randFloat(
                    -.6,
                    .6
                );


            planet.add(
                ring
            );
        }


        /*
         * Vệ tinh nhỏ hơn thì ở xa hơn,
         * vệ tinh lớn thì gần camera hơn.
         */
        const radiusX =
            isLarge
                ? THREE.MathUtils.randFloat(
                    7.5,
                    10.5
                )
                : THREE.MathUtils.randFloat(
                    6.5,
                    12.5
                );


        const radiusZ =
            isLarge
                ? THREE.MathUtils.randFloat(
                    3.0,
                    5.5
                )
                : THREE.MathUtils.randFloat(
                    2.5,
                    5.8
                );


        const vertical =
            THREE.MathUtils.randFloat(
                -1.2,
                5.8
            );


        const angle =
            (
                i /
                CONFIG.satellites
            ) *
            Math.PI *
            2 +
            THREE.MathUtils.randFloat(
                -.4,
                .4
            );


        const speed =
            THREE.MathUtils.randFloat(
                .055,
                .14
            ) *
            (
                i % 2 === 0
                    ? 1
                    : -1
            );


        const tilt =
            THREE.MathUtils.randFloat(
                -.55,
                .55
            );


        const phase =
            Math.random() *
            Math.PI *
            2;


        group.add(
            planet
        );


        satelliteData.push({

            object:
                planet,

            ring,

            radiusX,

            radiusZ,

            vertical,

            angle,

            speed,

            tilt,

            phase,

            size
        });
    }


    /*
     * Một số đường quỹ đạo cực mờ để tạo cảm giác
     * các vệ tinh thực sự đang bay trong không gian.
     */
    function createOrbitLine(
        radiusX,
        radiusZ,
        y,
        rotation
    ) {

        const points = [];

        const segments = 100;

        for (
            let i = 0;
            i <= segments;
            i++
        ) {

            const angle =
                (
                    i /
                    segments
                ) *
                Math.PI *
                2;

            points.push(
                new THREE.Vector3(
                    Math.cos(angle) *
                    radiusX,

                    y,

                    Math.sin(angle) *
                    radiusZ
                )
            );
        }


        const geometry =
            new THREE.BufferGeometry()
                .setFromPoints(
                    points
                );


        const material =
            new THREE.LineBasicMaterial({

                color:
                    0xff2aaa,

                transparent:
                    true,

                opacity:
                    .055,

                depthWrite:
                    false,

                blending:
                    THREE.AdditiveBlending
            });


        const line =
            new THREE.Line(
                geometry,
                material
            );


        line.rotation.z =
            rotation;

        group.add(line);
    }


    createOrbitLine(
        8.8,
        3.6,
        1.5,
        -.2
    );

    createOrbitLine(
        10.5,
        4.7,
        3.7,
        .35
    );

    createOrbitLine(
        7.2,
        5.2,
        -1.0,
        -.5
    );


    function update(time) {

        satelliteData.forEach(
            data => {

                data.angle +=
                    data.speed *
                    .012;


                const a =
                    data.angle;


                let x =
                    Math.cos(a) *
                    data.radiusX;

                let z =
                    Math.sin(a) *
                    data.radiusZ;


                /*
                 * Tilt quỹ đạo.
                 */
                const tiltedY =
                    Math.sin(a) *
                    data.radiusZ *
                    Math.sin(
                        data.tilt
                    );


                const y =
                    data.vertical +
                    tiltedY;


                /*
                 * Một chút chuyển động nổi.
                 */
                const floating =
                    Math.sin(
                        time *
                        .45 +
                        data.phase
                    ) *
                    .22;


                data.object.position.set(
                    x,
                    y + floating,
                    z
                );


                /*
                 * Vệ tinh quay nhẹ.
                 */
                data.object.material.opacity =
                    .58 +
                    (
                        Math.sin(
                            time *
                            1.3 +
                            data.phase
                        ) + 1
                    ) *
                    .16;


                if (data.ring) {

                    data.ring.rotation.z +=
                        .0009;

                    data.ring.material.opacity =
                        .38 +
                        (
                            Math.sin(
                                time *
                                .9 +
                                data.phase
                            ) + 1
                        ) *
                        .12;
                }


                /*
                 * Vệ tinh lớn hơn khi ở gần camera.
                 */
                const depthScale =
                    THREE.MathUtils.clamp(
                        1 -
                        z / 20,
                        .72,
                        1.3
                    );


                data.object.scale.set(
                    data.size *
                    depthScale,

                    data.size *
                    depthScale,

                    1
                );
            }
        );


        /*
         * Toàn bộ hệ vệ tinh quay rất chậm,
         * tạo cảm giác không gian 3D.
         */
        group.rotation.y =
            time * .012;

        group.rotation.x =
            Math.sin(
                time * .08
            ) * .025;
    }


    return {
        group,
        update
    };
}


const satelliteSystem =
    createSatelliteSystem();


/* =========================================================
   SMALL FLOATING HEARTS
========================================================= */

function createSmallHeartTexture() {

    const canvas =
        document.createElement("canvas");

    canvas.width = 128;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.translate(
        64,
        64
    );

    ctx.scale(
        1.3,
        1.3
    );

    ctx.beginPath();

    ctx.moveTo(
        0,
        35
    );

    ctx.bezierCurveTo(
        -50,
        0,
        -35,
        -35,
        -12,
        -35
    );

    ctx.bezierCurveTo(
        -3,
        -35,
        0,
        -25,
        0,
        -18
    );

    ctx.bezierCurveTo(
        0,
        -25,
        3,
        -35,
        12,
        -35
    );

    ctx.bezierCurveTo(
        35,
        -35,
        50,
        0,
        0,
        35
    );

    ctx.closePath();

    ctx.shadowColor =
        "#ff1493";

    ctx.shadowBlur =
        20;

    ctx.fillStyle =
        "#ff4bb2";

    ctx.fill();

    return new THREE.CanvasTexture(
        canvas
    );
}


function createFloatingHearts() {

    const group =
        new THREE.Group();

    const texture =
        createSmallHeartTexture();

    const count =
        CONFIG.floatingParticles;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const material =
            new THREE.SpriteMaterial({

                map:
                    texture,

                color:
                    Math.random() > .5
                        ? 0xff5db8
                        : 0xffb7e1,

                transparent: true,

                opacity:
                    THREE.MathUtils.randFloat(
                        .3,
                        .9
                    ),

                depthWrite: false,

                blending:
                    THREE.AdditiveBlending
            });


        const sprite =
            new THREE.Sprite(
                material
            );


        sprite.userData = {

            angle:
                Math.random() *
                Math.PI *
                2,

            radius:
                THREE.MathUtils.randFloat(
                    4,
                    9
                ),

            speed:
                THREE.MathUtils.randFloat(
                    .1,
                    .4
                ),

            y:
                THREE.MathUtils.randFloat(
                    -2,
                    7
                ),

            phase:
                Math.random() *
                Math.PI *
                2
        };


        const size =
            THREE.MathUtils.randFloat(
                .08,
                .3
            );

        sprite.scale.set(
            size,
            size,
            size
        );

        group.add(sprite);
    }


    scene.add(group);

    return group;
}


const floatingHearts =
    createFloatingHearts();


/* =========================================================
   MOUSE / TOUCH ROTATION
========================================================= */

let isDragging = false;

let lastX = 0;
let lastY = 0;

let targetRotationY = 0;
let targetRotationX = 0;

let currentRotationY = 0;
let currentRotationX = 0;


canvas.addEventListener(
    "pointerdown",
    event => {

        isDragging = true;

        lastX =
            event.clientX;

        lastY =
            event.clientY;

        canvas.setPointerCapture(
            event.pointerId
        );
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (!isDragging) {
            return;
        }

        const dx =
            event.clientX -
            lastX;

        const dy =
            event.clientY -
            lastY;

        targetRotationY +=
            dx * .008;

        targetRotationX +=
            dy * .004;

        targetRotationX =
            THREE.MathUtils.clamp(
                targetRotationX,
                -.45,
                .45
            );

        lastX =
            event.clientX;

        lastY =
            event.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    () => {
        isDragging = false;
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {
        isDragging = false;
    }
);


/* =========================================================
   BACKGROUND MUSIC
========================================================= */

const bgMusic =
    document.getElementById(
        "bgMusic"
    );

bgMusic.volume = .35;


async function playMusic() {

    try {

        await bgMusic.play();

    } catch (error) {

        console.log(
            "Autoplay bị trình duyệt chặn"
        );
    }
}


window.addEventListener(
    "load",
    () => {
        playMusic();
    }
);


const startMusic =
    () => {

        if (bgMusic.paused) {
            playMusic();
        }

        document.removeEventListener(
            "touchstart",
            startMusic
        );

        document.removeEventListener(
            "pointerdown",
            startMusic
        );
    };


document.addEventListener(
    "touchstart",
    startMusic,
    { once: true }
);

document.addEventListener(
    "pointerdown",
    startMusic,
    { once: true }
);


/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* =====================================================
       FORMATION
       0 = chưa có tim
       1 = tim hoàn chỉnh
    ===================================================== */

    const formation =
        THREE.MathUtils.clamp(
            time /
            CONFIG.formationDuration,
            0,
            1
        );


    /*
     * Sao băng rơi xuống tạo trái tim
     */
    heartMeteorSystem.update(
        time,
        formation
    );

    /*
     * Vệ tinh / hành tinh xung quanh trái tim
     */
    satelliteSystem.update(
        time
    );


    /* =====================================================
       AUTO ROTATE
    ===================================================== */

    if (!isDragging) {

        targetRotationY +=
            .0018;
    }


    currentRotationY +=
        (
            targetRotationY -
            currentRotationY
        ) * .04;

    currentRotationX +=
        (
            targetRotationX -
            currentRotationX
        ) * .04;


    heartGroup.rotation.y =
        currentRotationY;

    heartGroup.rotation.x =
        currentRotationX;


    /* =====================================================
       HEARTBEAT
    ===================================================== */

    const beat =
        1 +
        Math.pow(
            Math.max(
                0,
                Math.sin(
                    time * 2.5
                )
            ),
            10
        ) *
        .035;


    heartMeteorSystem.heads.scale.set(
        beat,
        beat,
        beat
    );


    /*
     * Sau khi tim hoàn chỉnh,
     * cho tim sáng nhấp nháy nhẹ.
     */
    heartMeteorSystem.heads.material.opacity =
        .7 +
        Math.sin(
            time * 2
        ) * .12;


    /* =====================================================
       STARS
    ===================================================== */

    stars.rotation.y =
        time * .003;


    /* =====================================================
       FLOOR
    ===================================================== */

    floor.rotation.y =
        time * .012;


    /* =====================================================
       TEXT RING
    ===================================================== */

    textGroup.rotation.y =
        time * .045;


    /* =====================================================
       FLOATING HEARTS
    ===================================================== */

    floatingHearts
        .children
        .forEach(
            sprite => {

                const data =
                    sprite.userData;

                data.angle +=
                    data.speed *
                    .003;

                sprite.position.x =
                    Math.cos(
                        data.angle
                    ) *
                    data.radius;

                sprite.position.z =
                    Math.sin(
                        data.angle
                    ) *
                    data.radius;

                sprite.position.y =
                    data.y +
                    Math.sin(
                        time * 1.2 +
                        data.phase
                    ) *
                    .45;

                sprite.material.opacity =
                    .25 +
                    (
                        Math.sin(
                            time * 2 +
                            data.phase
                        ) + 1
                    ) * .25;
            }
        );


    /* =====================================================
       CAMERA
    ===================================================== */

    camera.position.y =
        1.5 +
        Math.sin(
            time * .25
        ) * .12;

    camera.lookAt(
        0,
        0,
        0
    );


    /* =====================================================
       RENDER
    ===================================================== */

    composer.render();
}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        const width =
            window.innerWidth;

        const height =
            window.innerHeight;

        camera.aspect =
            width / height;

        camera.updateProjectionMatrix();

        renderer.setSize(
            width,
            height
        );

        composer.setSize(
            width,
            height
        );

        bloom.resolution.set(
            width,
            height
        );
    }
);


/* =========================================================
   START
========================================================= */

setTimeout(
    () => {

        loading.classList.add(
            "hide"
        );

    },
    500
);
